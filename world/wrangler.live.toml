# Pixeldate World · live on workers.dev (deploy: `npx wrangler deploy -c wrangler.live.toml` from world/).
# The one Pixeldate site. Deployed by .github/workflows/deploy.yml on push to main (tools/deploy.sh from the box).
# One worker serves both: the realtime café (Durable Objects, /parties/area/cafe-N) and the client as Workers static
# assets under /Pixeldate/ (built with VITE_WORLD_URL=wss://pixeldate-world.pixeldate.workers.dev into ../deploy/site/Pixeldate/).
# Anything that isn't a file (/parties/*, /health) falls through to the worker. Play: /Pixeldate/app/?world=cafe&invite=…
# INVITES is an encrypted secret (`wrangler secret put INVITES -c wrangler.live.toml`, via stdin), never a [var] here.
# No DEV var, so /dev/reports is off. Local dev keeps using wrangler.toml (dev invites, DEV=1).
name = "pixeldate-world"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "../deploy/site"
# "/" and "/Pixeldate" redirect to /Pixeldate/app/ in the worker (otherwise the assets layer would answer /Pixeldate with
# its own trailing-slash redirect to the landing). No SPA not_found_handling: /parties/*, /turn and /health must reach the worker.
run_worker_first = ["/", "/Pixeldate"]

[[durable_objects.bindings]]
name = "Area"
class_name = "Area"

[[durable_objects.bindings]]
name = "User"
class_name = "User"

[[durable_objects.bindings]]
name = "Mod"
class_name = "Mod"

[[durable_objects.bindings]]
name = "Pair"
class_name = "Pair"

[[durable_objects.bindings]]
name = "Budget"
class_name = "Budget"

# SQLite-backed Durable Objects (the kind available on the Workers Free plan)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Area", "User", "Mod"]

# v05: app-wide pair levels (one object per pair)
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Pair"]

# free-plan blocks: TURN budget and the daily request count (one object)
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Budget"]

[vars]
# for the TURN usage check (GraphQL). TURN_KEY_ID, TURN_KEY_API_TOKEN and CF_ANALYTICS_TOKEN (Account Analytics Read only)
# are encrypted secrets, never vars.
CF_ACCOUNT_ID = "e47f2e7fa2db3b4feaffc27fdd91308c"
