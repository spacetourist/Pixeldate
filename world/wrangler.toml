# Pixeldate World · local dev: `npm run dev` (wrangler dev, miniflare). Not deployed yet: no Cloudflare account.
name = "pixeldate-world"
main = "src/worker.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "Area"
class_name = "Area"

[[durable_objects.bindings]]
name = "User"
class_name = "User"

[[durable_objects.bindings]]
name = "Mod"
class_name = "Mod"

[[durable_objects.bindings]]
name = "Pair"
class_name = "Pair"

[[durable_objects.bindings]]
name = "Budget"
class_name = "Budget"

# SQLite-backed Durable Objects (the kind available on the Workers Free plan)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Area", "User", "Mod"]

# v05: app-wide pair levels (one object per pair)
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Pair"]

# free-plan blocks: TURN budget and the daily request count (one object)
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Budget"]

[vars]
# dev-only invite list. For production, move INVITES to an encrypted secret and remove DEV.
INVITES = "dev-invite-1,dev-invite-2,dev-invite-3"
DEV = "1"
# dev only: drop a silent socket after 3 s so tests see a hard disconnect quickly (production default: 15 s)
STALE_MS = "3000"
# dev only: /turn hands out a fake TURN entry (no Cloudflare key locally)
TURN_MOCK = "1"
